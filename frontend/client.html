<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockFlow - Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <span class="brand"><i class="mark"></i>StockFlow <small>Client</small></span>
    <div class="who"><span id="who"></span><button class="secondary" id="logout">Log out</button></div>
  </header>

  <main class="page">
    <section class="card">
      <h2>Place an order</h2>
      <form id="order-form">
        <div class="row">
          <label>Warehouse <select id="warehouse" required></select></label>
          <label>Delivery address <input id="address" required></label>
        </div>
        <table>
          <thead><tr><th>ID</th><th>Item</th><th>Price</th><th>Available</th><th>Quantity</th></tr></thead>
          <tbody id="catalog"></tbody>
        </table>
        <p class="muted">Available is the stock in the warehouse you chose. Deactivated items are shown for stock reference but cannot be ordered. Stock is taken out when staff confirm your order.</p>
        <p><button type="submit">Place order</button></p>
        <p id="order-message"></p>
      </form>
    </section>

    <section class="card">
      <h2>My orders</h2>
      <table id="orders-table"></table>
      <div id="order-detail"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
